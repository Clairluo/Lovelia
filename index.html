<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovelia</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff0f5;
    }

    /* 顶部整条进度栏 */
    .topBar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 16px 24px;
        background: rgba(255, 240, 245, 0.92);
        border-bottom: 2px solid #ffd6e0;
        z-index: 300;
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .gameTitle {
        font-size: 24px;
        font-weight: 900;
        color: #ff4466;
        white-space: nowrap;
    }

    .scoreText {
        font-size: 20px;
        font-weight: bold;
        color: #bb2244;
        white-space: nowrap;
    }

    .progressBg {
        flex: 1;
        height: 24px;
        background: #ffd6e0;
        border-radius: 999px;
        overflow: hidden;
    }

    #progressFill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #ff6688, #ff4466, #ff2244);
        transition: width 0.35s ease-out;
    }

    /* 右上角按钮 */
    #stopMusicBtn {
        padding: 8px 14px;
        border: none;
        border-radius: 999px;
        background: #ff6688;
        color: white;
        font-size: 16px;
        cursor: pointer;
        z-index: 301;
    }

    #restartBtn {
        padding: 6px 12px;
        border: none;
        border-radius: 999px;
        background: #dd4466;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
        z-index: 301;
    }

    /* 右侧照片区域：画面右2/3 */
    #photoArea {
        position: fixed;
        top: 72px;
        right: 0;
        width: 66.67%;
        height: calc(100% - 72px);
        z-index: 10;
    }

    /* 照片放大 */
    .item {
        position: absolute;
        cursor: pointer;
        transition: transform 0.15s;
    }

    .item:hover {
        transform: scale(1.06);
    }

    .item:active {
        transform: scale(0.92);
    }

    .gameImg {
        width: 160px;
        height: auto;
        border-radius: 18px;
        box-shadow: 0 10px 24px rgba(255, 80, 120, 0.35);
        border: 3px solid #ffb6c8;
    }

    /* 分值弹出文字 */
    .scorePopup {
        position: absolute;
        font-size: 32px;
        font-weight: 900;
        pointer-events: none;
        text-shadow: 0 3px 10px rgba(255, 255, 255, 0.9), 0 0 18px rgba(255, 100, 150, 0.6);
        animation: scoreUp 0.9s ease-out forwards;
        z-index: 200;
        white-space: nowrap;
    }

    .scoreAdd {
        color: #ff2244;
    }

    .scoreMinus {
        color: #6a3a7a;
    }

    @keyframes scoreUp {
        0% {
            opacity: 0;
            transform: translateY(20px) scale(0.8);
        }
        20% {
            opacity: 1;
            transform: translateY(-10px) scale(1.15);
        }
        100% {
            opacity: 0;
            transform: translateY(-70px) scale(1);
        }
    }

    /* 爱心样式 */
    .heart {
        position: absolute;
        pointer-events: none;
        clip-path: polygon(
            50% 92%, 38% 84%, 28% 74%, 20% 64%, 14% 54%, 11% 44%,
            12% 34%, 18% 26%, 26% 20%, 36% 18%, 46% 20%, 50% 26%,
            54% 20%, 64% 18%, 74% 20%, 82% 26%, 88% 34%, 89% 44%,
            86% 54%, 80% 64%, 72% 74%, 62% 84%
        );
    }

    @keyframes heartFlyNormal {
        0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
        100% { opacity: 0; transform: translateY(-110vh) rotate(15deg) scale(0.3); }
    }

    @keyframes heartFlyCrazy {
        0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
        100% { opacity: 0; transform: translateY(-120vh) rotate(30deg) scale(0.25); }
    }

    /* 通关合照弹窗 */
    #winModal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        z-index: 400;
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }

    #winModal img {
        max-width: 80%;
        max-height: 70vh;
        border-radius: 20px;
        box-shadow: 0 0 50px rgba(255, 100, 150, 0.8);
        animation: popIn 0.5s ease-out;
    }

    @keyframes popIn {
        0% { transform: scale(0.3); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    #closeModalBtn {
        margin-top: 28px;
        padding: 12px 24px;
        border: none;
        border-radius: 999px;
        background: #ff4466;
        color: #fff;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }
</style>
</head>

<body>
    <div class="topBar">
        <div class="gameTitle">Lovelia</div>
        <div class="scoreText" id="scoreText">0</div>
        <div class="progressBg">
            <div id="progressFill"></div>
        </div>
        <button id="stopMusicBtn">关闭音乐</button>
        <button id="restartBtn">重新开始</button>
    </div>

    <div id="photoArea"></div>

    <div id="winModal">
        <img src="end_bonus.png" alt="合照">
        <button id="closeModalBtn">关闭图片</button>
    </div>

<script>
    const scoreText = document.getElementById("scoreText");
    const progressFill = document.getElementById("progressFill");
    const winModal = document.getElementById("winModal");
    const stopBtn = document.getElementById("stopMusicBtn");
    const restartBtn = document.getElementById("restartBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const photoArea = document.getElementById("photoArea");

    let progress = 0;
    const MAX_PROGRESS = 52; // 后台隐藏目标分数，界面不展示
    const MUSIC_TRIGGER = 1;
    let winTriggered = false;
    let musicStarted = false;
    let audioPlayer = null;
    let heartTimer = null;

    // 分值规则：第一张+1，第二张+2，第三张+3，第四张-2
    const imageConfig = [
        { src: "photo1.png", progressAdd: 1, label: "+1" },
        { src: "photo2.png", progressAdd: 2, label: "+2" },
        { src: "photo3.png", progressAdd: 3, label: "+3" },
        { src: "photo4.png", progressAdd: -2, label: "-2" }
    ];

    // 更新分数和进度条
    function updateScoreAndProgress() {
        scoreText.textContent = progress;
        // 进度条比例随当前分数/52变化，但是界面看不到52
        const percent = Math.min((progress / MAX_PROGRESS) * 100,100);
        progressFill.style.width = percent + "%";
    }

    // 重置游戏
    function resetGame() {
        progress = 0;
        winTriggered = false;
        musicStarted = false;
        updateScoreAndProgress();
        winModal.style.display = "none";
        photoArea.innerHTML = "";

        if (audioPlayer) {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            audioPlayer = null;
        }

        if (heartTimer) {
            clearInterval(heartTimer);
            heartTimer = null;
        }

        startNormalHeart();
    }

    restartBtn.onclick = resetGame;

    stopBtn.onclick = function () {
        if (audioPlayer) {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            musicStarted = false;

            if (heartTimer) {
                clearInterval(heartTimer);
                heartTimer = null;
            }
        }
    };

    closeModalBtn.onclick = function () {
        winModal.style.display = "none";
    };

    // 分值弹出效果
    function showScorePopup(x, y, label, isAdd) {
        const div = document.createElement("div");
        div.className = "scorePopup " + (isAdd ? "scoreAdd" : "scoreMinus");
        div.textContent = label;
        div.style.left = x + "px";
        div.style.top = y + "px";
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 900);
    }

    // 普通爱心
    function startNormalHeart() {
        const colors = ["#ff4466", "#ff2255", "#ff6699", "#ff88bb", "#ff3388", "#ff5588", "#ff99cc"];
        heartTimer = setInterval(() => {
            const h = document.createElement("div");
            h.className = "heart";
            const size = 30 + Math.random() * 45;
            h.style.width = size + "px";
            h.style.height = size + "px";
            h.style.background = colors[Math.floor(Math.random() * colors.length)];
            h.style.left = Math.random() * window.innerWidth + "px";
            h.style.bottom = Math.random() * window.innerHeight + "px";
            h.style.animation = "heartFlyNormal 7s ease-out forwards";
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 7000);
        }, 200);
    }

    // 通关浮夸爱心
    function startCrazyHeart() {
        clearInterval(heartTimer);
        const colors = ["#ff4466", "#ff2255", "#ff6699", "#ff88bb", "#ff3388", "#ff5588", "#ff99cc"];
        heartTimer = setInterval(() => {
            for (let i = 0; i < 4; i++) {
                const h = document.createElement("div");
                h.className = "heart";
                const size = 25 + Math.random() * 55;
                h.style.width = size + "px";
                h.style.height = size + "px";
                h.style.background = colors[Math.floor(Math.random() * colors.length)];
                h.style.left = Math.random() * window.innerWidth + "px";
                h.style.bottom = Math.random() * window.innerHeight + "px";
                h.style.animation = "heartFlyCrazy 2.8s ease-out forwards";
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 2800);
            }
        }, 70);
    }

    // 生成右侧大照片
    function createRandomItem() {
        const item = document.createElement("img");
        const randomItem = imageConfig[Math.floor(Math.random() * imageConfig.length)];
        item.src = randomItem.src;
        item.className = "item gameImg";

        const areaWidth = photoArea.clientWidth || 700;
        const areaHeight = photoArea.clientHeight || 800;

        const x = Math.random() * Math.max(40, areaWidth - 200);
        const y = Math.random() * Math.max(40, areaHeight - 220) + 40;

        item.style.left = x + "px";
        item.style.top = y + "px";

        item.onclick = function (e) {
            progress += randomItem.progressAdd;
            if (progress < 0) progress = 0;
            if (progress > MAX_PROGRESS) progress = MAX_PROGRESS;

            updateScoreAndProgress();
            showScorePopup(e.clientX, e.clientY, randomItem.label, randomItem.progressAdd > 0);

            item.remove();
            checkMusic();
            checkWin();
        };

        photoArea.appendChild(item);

        setTimeout(() => {
            if (item.parentNode) item.remove();
        }, 7000);
    }

    function checkMusic() {
        if (progress >= MUSIC_TRIGGER && !musicStarted) {
            musicStarted = true;
            audioPlayer = new Audio("win_music.mp3");
            audioPlayer.volume = 0.6;
            audioPlayer.loop = true;
            audioPlayer.play().catch(err => console.log("浏览器需要点击页面后播放音频", err));
        }
    }

    function checkWin() {
        if (progress >= MAX_PROGRESS && !winTriggered) {
            winTriggered = true;
            winModal.style.display = "flex";
            startCrazyHeart();
        }
    }

    // 启动游戏
    updateScoreAndProgress();
    startNormalHeart();
    setInterval(createRandomItem, 1400);
</script>
</body>
</html>
