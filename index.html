<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片收集小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }
        #scoreBox {
            position: fixed;
            top: 30px;
            left: 24px;
            font-size: 32px;
            font-weight: bold;
            z-index: 100;
        }
        .item {
            position: absolute;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .item:active {
            transform: scale(0.9);
        }
        .gameImg {
            width: 80px;
            height: auto;
        }
        /* 浮动加分扣分文字 */
        .floatText {
            position: absolute;
            font-size:28px;
            font-weight:bold;
            pointer-events:none;
            animation: floatUp 1s ease-out forwards;
            z-index:99;
        }
        .add {
            color:#28a745;
        }
        .minus {
            color:#dc3545;
        }
        @keyframes floatUp {
            0% {opacity:1; transform: translateY(0);}
            100% {opacity:0; transform: translateY(-60px);}
        }
        /* 爱心动画 */
        .heart{
            position:absolute;
            width:30px;
            background:#ff4466;
            transform:rotate(-45deg);
            animation: heartFly 3.5s ease-out forwards;
            pointer-events:none;
        }
        .heart:before,.heart:after{
            content:"";
            width:30px;
            height:30px;
            background:#ff4466;
            border-radius:50%;
            position:absolute;
        }
        .heart:before{top:-15px;left:0;}
        .heart:after{top:0;right:-15px;}
        @keyframes heartFly{
            0%{opacity:1;transform: translateY(0) rotate(-45deg);}
            100%{opacity:0;transform: translateY(-800px) rotate(-45deg);}
        }
        /* 胜利弹窗 */
        #winModal{
            position:fixed;
            top:0;left:0;
            width:100%;height:100%;
            background:rgba(0,0,0,0.6);
            display:none;
            z-index:200;
            align-items:center;
            justify-content:center;
            flex-direction:column;
        }
        #winModal img{
            max-width:80%;
            border-radius:12px;
        }
        #winModal p{
            color:white;
            font-size:28px;
            margin-top:20px;
        }
    </style>
</head>
<body>
    <div id="scoreBox">当前分数：0</div>
    <div id="winModal">
        <img src="end_bonus.png" alt="奖励合照">
        <p>🎉恭喜！收集完成！</p>
    </div>

    <script>
        const scoreBox = document.getElementById("scoreBox");
        const winModal = document.getElementById("winModal");
        let score = 0;
        const targetScore = 52;
        // 加分图片列表
        const bonusList = ["photo1.png","photo2.png","photo3.png"];
        // 扣分图片
        const badImg = "photo4.png";

        // 弹出浮动加减文字
        function showFloatText(x,y,text,isAdd){
            const div = document.createElement('div');
            div.className = "floatText " + (isAdd?"add":"minus");
            div.innerText = text;
            div.style.left = x + "px";
            div.style.top = y + "px";
            document.body.appendChild(div);
            setTimeout(()=>div.remove(),1000);
        }

        // 创建随机图片：有概率出加分图，小概率出photo4扣分图
        function createRandomItem(){
            const item = document.createElement("img");
            // 70%概率加分，30%概率扣分
            const isBonus = Math.random() < 0.7;
            if(isBonus){
                const randomBonusImg = bonusList[Math.floor(Math.random() * bonusList.length)];
                item.src = randomBonusImg;
            }else{
                item.src = badImg;
            }
            item.className = "item gameImg";

            // 随机位置
            const x = Math.random()*(window.innerWidth - 100);
            const y = Math.random()*(window.innerHeight - 200) + 80;
            item.style.left = x + "px";
            item.style.top = y + "px";

            item.onclick = function(e){
                if(isBonus){
                    score +=1;
                    showFloatText(e.clientX,e.clientY,"+1",true);
                }else{
                    score -=2;
                    if(score < 0) score = 0;
                    showFloatText(e.clientX,e.clientY,"-2",false);
                }
                updateScore();
                item.remove();
                checkWin();
            }
            document.body.appendChild(item);
            // 图片超时自动消失
            setTimeout(()=>{if(item.parentNode) item.remove()},7000);
        }

        function updateScore(){
            scoreBox.innerText = "当前分数："+score;
        }

        function checkWin(){
            if(score >= targetScore){
                winModal.style.display="flex";
                createManyHearts();
            }
        }

        // 胜利爱心爆发
        function createManyHearts(){
            for(let i=0;i<25;i++){
                setTimeout(()=>{
                    const h = document.createElement("div");
                    h.className="heart";
                    h.style.left = Math.random()*window.innerWidth +"px";
                    h.style.bottom = "0px";
                    document.body.appendChild(h);
                    setTimeout(()=>h.remove(),3500);
                },i*120);
            }
        }

        // 定时生成图片，1.4秒出来一张，不会一次性爆一大堆
        setInterval(createRandomItem, 1400);
    </script>
</body>
</html>
