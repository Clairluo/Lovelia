<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>照片收集小游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#fff;font-family:system-ui,sans-serif;}
#scoreBox{position:fixed;top:20px;left:20px;font-size:24px;font-weight:bold;z-index:100;}
.item{position:absolute;width:90px;height:90px;cursor:pointer;object-fit:contain;}
.bonusImg{position:absolute;z-index:200;display:none;object-fit:contain;}

/* 爱心样式 */
.heart{
  position:absolute;
  width:30px;height:30px;
  background:#ff5588;
  transform:rotate(-45deg);
  animation:heartFly 3.5s ease-out forwards;
  z-index:150;
}
.heart::before,.heart::after{
  content:"";
  width:30px;height:30px;
  background:#ff5588;
  border-radius:50%;
  position:absolute;
}
.heart::before{top:-15px;left:0;}
.heart::after{top:0;right:-15px;}
@keyframes heartFly{
  0%{opacity:1;transform:rotate(-45deg) translateY(0) scale(1);}
  100%{opacity:0;transform:rotate(-45deg) translateY(-400px) scale(0.4);}
}
</style>
</head>
<body>
<div id="scoreBox">当前分数：0</div>
<img class="bonusImg" id="bonusImg" src="end_bonus.png">

<script>
(function(){
"use strict";
const playArea = document.body;
const scoreEl = document.getElementById("scoreBox");
const bonusImg = document.getElementById("bonusImg");

const itemList = [
  {src:"photo1.png", point:1, weight:60},
  {src:"photo2.png", point:2, weight:25},
  {src:"photo3.png", point:3, weight:10},
  {src:"photo4.png", point:-2, weight:5}
];
const TARGET_SCORE = 52;
let score = 0;
let bonusTriggered = false;

function pickRandomItem(){
  let totalWeight = itemList.reduce((sum,item)=>sum+item.weight,0);
  let randomVal = Math.random() * totalWeight;
  for(let item of itemList){
    randomVal -= item.weight;
    if(randomVal <= 0) return item;
  }
  return itemList[0];
}

function spawnItem(){
  const randomOne = pickRandomItem();
  const img = document.createElement("img");
  img.className = "item";
  img.src = randomOne.src;
  img.dataset.point = randomOne.point;

  const startX = Math.random() * (window.innerWidth - 100);
  img.style.left = startX + "px";
  img.style.top = "-100px";
  playArea.appendChild(img);

  img.addEventListener("pointerdown", function(e){
    e.preventDefault();
    const addPoint = Number(this.dataset.point);
    score += addPoint;
    if(score < 0) score = 0;
    scoreEl.innerText = "当前分数：" + score;

    if(score >= TARGET_SCORE && !bonusTriggered){
      bonusTriggered = true;
      triggerBonus(e.clientX, e.clientY);
    }
    this.remove();
  })

  let topPos = -100;
  const speed = 1.8;
  function fall(){
    topPos += speed;
    img.style.top = topPos + "px";
    if(topPos < window.innerHeight + 50){
      requestAnimationFrame(fall);
    }else{
      img.remove();
    }
  }
  requestAnimationFrame(fall);
}

function triggerBonus(x,y){
  // 长图自适应：宽度最多占屏幕86%，高度最多占屏幕80%
  bonusImg.style.width = "86vw";
  bonusImg.style.height = "auto";
  bonusImg.style.maxHeight = "80vh";

  // 居中显示
  bonusImg.style.left = "50%";
  bonusImg.style.top = "50%";
  bonusImg.style.transform = "translate(-50%, -50%)";
  bonusImg.style.display = "block";

  // 满屏爱心
  for(let i=0;i<30;i++){
    setTimeout(()=>{
      createHeart();
    },i*40);
  }

  // 5秒后消失
  setTimeout(()=>{
    bonusImg.style.display = "none";
  },5000);
}

function createHeart(){
  const h = document.createElement("div");
  h.className = "heart";
  h.style.left = Math.random() * window.innerWidth + "px";
  h.style.top = window.innerHeight + "px";
  playArea.appendChild(h);
  setTimeout(()=>h.remove(),3500);
}

setInterval(spawnItem,750);

})();
</script>
</body>
</html>
